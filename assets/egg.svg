<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="220" role="img" aria-label="An Ancient Egg on a Builder stone, glowing">
<title>An Ancient Egg on a Builder stone, glowing</title>
<style>
text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
@keyframes puls { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.puls { animation: puls 4s ease-in-out infinite; }
.puls2 { animation: puls 4s ease-in-out 2s infinite; }
@keyframes zeichnen { from { stroke-dashoffset: 1.05; } to { stroke-dashoffset: 0; } }
.zieh { stroke-dasharray: 1 1.1; animation: zeichnen 1s cubic-bezier(.6, 0, .3, 1) both; }
@keyframes auf { from { opacity: 0; transform: translateY(10px) scale(.8); } to { opacity: 1; transform: none; } }
.auf { animation: auf .7s cubic-bezier(.2, .8, .3, 1.25) both; transform-box: fill-box; transform-origin: center; }
@keyframes wiegen { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(5px) rotate(2deg); } }
.wiegen { animation: wiegen 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 20%; }
@keyframes schweben { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.schweben { animation: schweben 3s ease-in-out infinite; }
@keyframes funkeln { 0%, 100% { opacity: .95; } 50% { opacity: .15; } }
.f1 { animation: funkeln 3.1s ease-in-out infinite; }
.f2 { animation: funkeln 4.3s ease-in-out 1.1s infinite; }
.f3 { animation: funkeln 5.7s ease-in-out 2.3s infinite; }
@keyframes gluehwurm { 0%, 100% { transform: translate(0, 0); opacity: .1; } 50% { transform: translate(7px, -12px); opacity: 1; } }
.gw { animation: gluehwurm 5s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

@keyframes wackeln { 0%, 76%, 100% { transform: rotate(0deg); } 80% { transform: rotate(-5deg); } 84% { transform: rotate(5deg); }
  88% { transform: rotate(-3deg); } 92% { transform: rotate(2deg); } }
.wackeln { animation: wackeln 5s ease-in-out 1s infinite; transform-box: fill-box; transform-origin: 50% 100%; }
</style>
<defs><radialGradient id="glowJade"><stop offset="0" stop-color="#7fdcb3" stop-opacity=".7"/><stop offset="1" stop-color="#7fdcb3" stop-opacity="0"/></radialGradient>
<radialGradient id="glowAmber"><stop offset="0" stop-color="#ffcf6a" stop-opacity=".85"/><stop offset="1" stop-color="#ffcf6a" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#2c2735"/><stop offset="1" stop-color="#16141b"/></radialGradient><filter id="weich" filterUnits="userSpaceOnUse" x="0" y="0" width="240" height="220"><feGaussianBlur stdDeviation="3.2"/></filter></defs>
<circle cx="120" cy="112" r="100" fill="url(#glowAmber)" class="puls" opacity=".55"/>
<polygon points="70,206 120,206 120,180 78,180" fill="#e2d8bd" /><polygon points="120,206 170,206 162,180 120,180" fill="#b7ae98" />
<polygon points="78,180 120,180 120,172 84,172" fill="#ece4cc" /><polygon points="120,180 162,180 156,172 120,172" fill="#c9bfa3" />
<path d="M96 200 H110 V186 H132 V196 H146" fill="none" stroke="#7fdcb3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="puls"/>
<g transform="translate(35 24.4) scale(1.7)"><g class="wackeln"><circle cx="50" cy="52" r="34" fill="url(#glowAmber)" class="puls"/><polygon points="50,14 42,17 35,26 30,40 28,56 31,71 39,83 50,88" fill="#4d4458" /><polygon points="50,14 58,17 65,26 70,40 72,56 69,71 61,83 50,88" fill="#352e3e" /><polygon points="37,30 44,20 43,34" fill="#71667e" /><path d="M40 26 Q44 44 38 60 Q44 72 46 84 M60 24 Q56 40 62 54 Q58 70 56 84 M44 46 L56 50" fill="none" stroke="#e0b450" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="50" cy="52" r="3" fill="#ffcf6a" class="puls2"/></g></g>
<polygon points="52,63 53.54,68.46 59,70 53.54,71.54 52,77 50.46,71.54 45,70 50.46,68.46" fill="#ffe08a" class="f1"/>
<polygon points="190,46 191.32,50.68 196,52 191.32,53.32 190,58 188.68,53.32 184,52 188.68,50.68" fill="#ffe08a" class="f2"/>
<polygon points="200,127 201.1,130.9 205,132 201.1,133.1 200,137 198.9,133.1 195,132 198.9,130.9" fill="#ffe08a" class="f3"/>
<polygon points="40,136 40.88,139.12 44,140 40.88,140.88 40,144 39.12,140.88 36,140 39.12,139.12" fill="#ffe08a" class="f2"/>
<polygon points="150,18 150.88,21.12 154,22 150.88,22.88 150,26 149.12,22.88 146,22 149.12,21.12" fill="#ffe08a" class="f3"/>
</svg>
