<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 72" width="960" height="72" role="img" aria-label="Toolbox: Roblox Studio, Luau, Rojo, Blender, Git">
<title>Toolbox: Roblox Studio, Luau, Rojo, Blender, Git</title>
<style>
text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
@keyframes puls { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.puls { animation: puls 4s ease-in-out infinite; }
.puls2 { animation: puls 4s ease-in-out 2s infinite; }
@keyframes zeichnen { from { stroke-dashoffset: 1.05; } to { stroke-dashoffset: 0; } }
.zieh { stroke-dasharray: 1 1.1; animation: zeichnen 1s cubic-bezier(.6, 0, .3, 1) both; }
@keyframes auf { from { opacity: 0; transform: translateY(10px) scale(.8); } to { opacity: 1; transform: none; } }
.auf { animation: auf .7s cubic-bezier(.2, .8, .3, 1.25) both; transform-box: fill-box; transform-origin: center; }
@keyframes wiegen { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(5px) rotate(2deg); } }
.wiegen { animation: wiegen 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 20%; }
@keyframes schweben { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.schweben { animation: schweben 3s ease-in-out infinite; }
@keyframes funkeln { 0%, 100% { opacity: .95; } 50% { opacity: .15; } }
.f1 { animation: funkeln 3.1s ease-in-out infinite; }
.f2 { animation: funkeln 4.3s ease-in-out 1.1s infinite; }
.f3 { animation: funkeln 5.7s ease-in-out 2.3s infinite; }
@keyframes gluehwurm { 0%, 100% { transform: translate(0, 0); opacity: .1; } 50% { transform: translate(7px, -12px); opacity: 1; } }
.gw { animation: gluehwurm 5s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><radialGradient id="glowJade"><stop offset="0" stop-color="#7fdcb3" stop-opacity=".7"/><stop offset="1" stop-color="#7fdcb3" stop-opacity="0"/></radialGradient>
<radialGradient id="glowAmber"><stop offset="0" stop-color="#ffcf6a" stop-opacity=".85"/><stop offset="1" stop-color="#ffcf6a" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#2c2735"/><stop offset="1" stop-color="#16141b"/></radialGradient><filter id="weich" filterUnits="userSpaceOnUse" x="0" y="0" width="960" height="72"><feGaussianBlur stdDeviation="3.2"/></filter></defs>
<g transform="translate(0 4)"><g class="auf" style="animation-delay:0.1s"><rect x=".5" y=".5" width="179" height="63" rx="10" fill="#16141b" stroke="#2c2933"/><g transform="translate(14 14)"><polygon points="18,4 32,11 18,18 4,11" fill="#e2d8bd" /><polygon points="4,11 18,18 18,33 4,26" fill="#b7ae98" /><polygon points="18,18 32,11 32,26 18,33" fill="#8f8470" /><path d="M4 11 L18 18 L32 11" fill="none" stroke="#7fdcb3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="puls"/></g><text x="62" y="30" font-size="15" fill="#ece6d6" text-anchor="start" font-weight="700" >Roblox Studio</text><text x="62" y="48" font-size="12.5" fill="#a8a191" text-anchor="start" font-weight="400" >building</text></g></g>
<g transform="translate(195 4)"><g class="auf" style="animation-delay:0.2s"><rect x=".5" y=".5" width="179" height="63" rx="10" fill="#16141b" stroke="#2c2933"/><g transform="translate(14 14)"><path d="M13 5 H9 V15 L5 18 L9 21 V31 H13 M23 5 H27 V15 L31 18 L27 21 V31 H23" fill="none" stroke="#7fdcb3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="62" y="30" font-size="15" fill="#ece6d6" text-anchor="start" font-weight="700" >Luau</text><text x="62" y="48" font-size="12.5" fill="#a8a191" text-anchor="start" font-weight="400" >scripting</text></g></g>
<g transform="translate(390 4)"><g class="auf" style="animation-delay:0.3s"><rect x=".5" y=".5" width="179" height="63" rx="10" fill="#16141b" stroke="#2c2933"/><g transform="translate(14 14)"><path d="M7 15 A11.5 11.5 0 0 1 28 11" fill="none" stroke="#ece6d6" stroke-width="2.6" stroke-linecap="round"/><polygon points="31,5 31,15 22,13" fill="#ece6d6" /><path d="M29 21 A11.5 11.5 0 0 1 8 25" fill="none" stroke="#7fdcb3" stroke-width="2.6" stroke-linecap="round"/><polygon points="5,31 5,21 14,23" fill="#7fdcb3" /></g><text x="62" y="30" font-size="15" fill="#ece6d6" text-anchor="start" font-weight="700" >Rojo</text><text x="62" y="48" font-size="12.5" fill="#a8a191" text-anchor="start" font-weight="400" >syncing code</text></g></g>
<g transform="translate(585 4)"><g class="auf" style="animation-delay:0.4s"><rect x=".5" y=".5" width="179" height="63" rx="10" fill="#16141b" stroke="#2c2933"/><g transform="translate(14 14)"><polygon points="18,3 5.01,10.5 5.01,25.5 18,33" fill="#ffb24a" /><polygon points="18,3 30.99,10.5 30.99,25.5 18,33" fill="#c97a2a" /><polygon points="8.91,11.25 16.05,6 13.45,17.25" fill="#ffd9a0" /><path d="M18 3 L5 10.5 L18 18 L31 10.5 M18 18 V33 M5 25.5 L18 18 L31 25.5" fill="none" stroke="#7a4a1a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/></g><text x="62" y="30" font-size="15" fill="#ece6d6" text-anchor="start" font-weight="700" >Blender</text><text x="62" y="48" font-size="12.5" fill="#a8a191" text-anchor="start" font-weight="400" >3D models</text></g></g>
<g transform="translate(780 4)"><g class="auf" style="animation-delay:0.5s"><rect x=".5" y=".5" width="179" height="63" rx="10" fill="#16141b" stroke="#2c2933"/><g transform="translate(14 14)"><path d="M11 7 V29 M25 13 Q25 22 11 24" fill="none" stroke="#7fdcb3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="11" cy="7" r="3.6" fill="#16141b" stroke="#7fdcb3" stroke-width="2.2"/><circle cx="11" cy="29" r="3.6" fill="#16141b" stroke="#7fdcb3" stroke-width="2.2"/><circle cx="25" cy="13" r="3.6" fill="#16141b" stroke="#ece6d6" stroke-width="2.2"/></g><text x="62" y="30" font-size="15" fill="#ece6d6" text-anchor="start" font-weight="700" >Git</text><text x="62" y="48" font-size="12.5" fill="#a8a191" text-anchor="start" font-weight="400" >saving versions</text></g></g>
</svg>
